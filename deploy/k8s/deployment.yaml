apiVersion: v1
kind: Namespace
metadata:
  name: grizzly

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grizzly-proxy
  namespace: grizzly
  labels:
    app: grizzly-proxy
    version: v0.1.0

spec:
  replicas: 2
  selector:
    matchLabels:
      app: grizzly-proxy
  template:
    metadata:
      labels:
        app: grizzly-proxy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
    spec:
      serviceAccountName: grizzly-proxy
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
      - name: grizzly-proxy
        image: ghcr.io/craftedwithintent/grizzly:latest
        imagePullPolicy: Always
        command: ["python", "-m", "grizzly.cli"]
        args: ["proxy", "--host", "0.0.0.0", "--port", "8081"]

        ports:
        - name: http
          containerPort: 8081
          protocol: TCP

        env:
        - name: LOG_LEVEL
          value: "info"

        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: grizzly-proxy
  namespace: grizzly
  labels:
    app: grizzly-proxy

spec:
  type: ClusterIP
  ports:
  - port: 8081
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: grizzly-proxy

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: grizzly-proxy
  namespace: grizzly

spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: grizzly-proxy

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grizzly-proxy
  namespace: grizzly
