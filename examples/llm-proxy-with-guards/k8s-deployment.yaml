apiVersion: v1
kind: Namespace
metadata:
  name: grizzly-example

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grizzly-proxy
  namespace: grizzly-example
  labels:
    app: grizzly-proxy
    example: llm-proxy-with-guards

spec:
  replicas: 2
  selector:
    matchLabels:
      app: grizzly-proxy
  template:
    metadata:
      labels:
        app: grizzly-proxy
    spec:
      containers:
      - name: grizzly-proxy
        image: ghcr.io/craftedwithintent/grizzly:latest
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 9000

        env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "9000"
        - name: LOG_LEVEL
          value: "info"

        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: grizzly-proxy
  namespace: grizzly-example

spec:
  type: ClusterIP
  ports:
  - port: 9000
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: grizzly-proxy
